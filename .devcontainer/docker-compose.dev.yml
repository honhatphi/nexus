services:
  # ── Dev Container (Node.js workspace) ────────────────────
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - node_modules_common:/workspace/nexus-hub/common-tools/node_modules
      - node_modules_mcp:/workspace/mcp-server/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=
      - MEMGRAPH_PASSWORD=
      - CHROMADB_URL=http://chromadb:8000
      - CHROMADB_TOKEN=
      - CHROMADB_COLLECTION=nexus_codebase
      - MCP_SERVER_PORT=3100
    depends_on:
      memgraph:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - default

  # ── Disable prod mcp-server in dev (run manually inside devcontainer) ──
  mcp-server:
    profiles:
      - production

volumes:
  node_modules_common:
  node_modules_mcp:
