version: "3.9"

services:
  # ── Graph Database ────────────────────────────────────────
  memgraph:
    image: memgraph/memgraph-platform:${MEMGRAPH_VERSION:-latest}
    container_name: nexus-memgraph
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "${MEMGRAPH_WEB_PORT:-3000}:3000"
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "echo", "RETURN 1;", "|", "mgconsole", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vector Database ───────────────────────────────────────
  chromadb:
    image: chromadb/chroma:${CHROMADB_VERSION:-latest}
    container_name: nexus-chromadb
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=${CHROMADB_TELEMETRY:-FALSE}
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMADB_TOKEN:-}
      - CHROMA_SERVER_AUTHN_PROVIDER=${CHROMADB_AUTH_PROVIDER:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  memgraph_data:
  chroma_data:
