# Nexus MCP config — Codex CLI
# Copy to ~/.codex/config.toml and update as needed.
#
# Codex CLI config reference:
#   https://github.com/openai/codex#configuration
#
# MCP server section uses the standard MCP HTTP transport format.

model = "o4-mini"          # or "gpt-4.1", "o3", etc.
approval_policy = "auto"   # "auto" | "on-failure" | "never"

# ── MCP Servers ──────────────────────────────────────────────
# Nexus Knowledge-Base MCP server (HTTP/SSE transport)
[mcp_servers.nexus-kb]
url  = "http://localhost:13100/mcp"
type = "http"   # Codex CLI ≥ 0.9 supports HTTP transport natively

# Optional: pass workspace ID as a header (uncomment if supported by your Codex version)
# [mcp_servers.nexus-kb.headers]
# x-nexus-workspace-id = "my-project"
