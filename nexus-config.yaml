# ─────────────────────────────────────────────────────────────
# Nexus — Hub & Spoke Configuration
# ─────────────────────────────────────────────────────────────
# Mô hình:
#   Hub  = /nexus-hub   → Tri thức dùng chung (Global Skills, Shared KB, Patterns)
#   Spoke = /services/* → Các Microservices độc lập, mỗi service có stack riêng
# ─────────────────────────────────────────────────────────────

hub:
  name: nexus-hub
  path: ./nexus-hub
  description: "Trung tâm tri thức dùng chung — Global Skills & Shared Knowledge Base"
  modules:
    skills:
      path: ./nexus-hub/skills
      description: "Reusable skill definitions cho mọi service"
    knowledge-base:
      path: ./nexus-hub/knowledge-base
      description: "Shared KB — architectural decisions, patterns, constraints"

services:
  - name: loyalty-app
    path: /Users/CPS-MKT1-D02072/CPS/Workspace/projects/ecommerce/apps/mobile/loyalty-app
    tech: Dart / Flutter
    runtime: "Flutter 3.x + Dart SDK >=3.8.0"
    description: "SMember — CellphoneS loyalty mobile app (iOS + Android). SDUI-driven, Firebase, BLoC/Cubit state management."
    git:
      default_branch: main
    databases:
      - Firebase (Auth, Firestore, Remote Config)
    dependencies:
      - graphql-catalog   # product catalog queries
      - graphql-search    # search queries
      - payment           # checkout flow

  - name: warehouse-2.0
    path: ./services/warehouse-2.0
    tech: Python
    runtime: "Python 3.8 + Apache Airflow 2.6.1"
    description: "Enterprise Data Warehouse & ETL Orchestration — product catalogs, pricing, inventory, promotions sync across ERP, Magento, MongoDB, Elasticsearch, Kafka"
    git:
      ssh: "git@git.cps.onl:cps/warehouse-2.0.git"
      default_branch: master
    databases:
      - PostgreSQL 13 (data warehouse via dbt)
      - MongoDB (prices, stocks, promotions)
      - Elasticsearch 7.15.2 (product search index)
      - Kafka (CDC — Change Data Capture)
      - Redis (Celery broker)
    pipelines:
      - "Stock Sync: ERP → Airflow → dbt → MongoDB + Elasticsearch"
      - "Price CDC: Kafka → PostgreSQL → dbt → Elasticsearch"
      - "Promotion CDC: Kafka → PostgreSQL → Elasticsearch"
      - "Product Search: PostgreSQL → MagicSearchProduct → ES Bulk Index"
    dependencies: []

# ─── Agent Behaviour ────────────────────────────────────────
agent:
  lookup_order:
    # Agent PHẢI tra cứu Hub trước, rồi mới đến Local Service
    - source: hub
      paths:
        - ./nexus-hub/knowledge-base
        - ./nexus-hub/skills
    - source: local
      description: "Fallback — tìm trong context của service đang làm việc"

  rules:
    - "Luôn gọi search_knowledge_base với Hub KB trước khi đề xuất bất kỳ thay đổi nào."
    - "Nếu Hub không có context → ghi nhận gap và proceed với best practices."
    - "Khi tạo pattern mới cho 1 service → kiểm tra xem nó có nên promote lên Hub không."
    - "Mỗi service tuân thủ tech stack riêng; không mix runtime giữa các services."

# ─── Quality Gates (Phase E2) ────────────────────────────────
quality_gates:
  # 0 = warn on any API contract removal. Increase to allow intentional removals.
  max_contract_drift: 0
  # Percent increase in blast radius that triggers a HIGH risk alert.
  max_blast_radius_increase: 20
  # Minimum test coverage for hotspot functions (score >= 0.7). Not yet enforced
  # automatically — used by scan_risks to flag coverage gaps.
  min_test_coverage_hotspot: 80
  # Hotspot score threshold above which a function is considered "critical".
  hotspot_critical_threshold: 0.7
  # Risk types checked by default when scan_risks is called without riskTypes param.
  default_risk_types:
    - security
    - stability
    - performance
